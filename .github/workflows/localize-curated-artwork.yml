name: Localize remaining reward artwork

on:
  push:
    branches:
      - agent/nwhub-icons-simple-catalog

permissions:
  contents: write

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/nwhub-icons-simple-catalog
          fetch-depth: 0

      - name: Download remaining artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/public/assets/rewards/curated

          fetch() {
            local url="$1"
            local output="$2"
            curl --fail --location --retry 3 --retry-delay 2 --user-agent "Mozilla/5.0" --referer "https://neverwinter.fandom.com/" "$url" --output "$output"
            test -s "$output"
          }

          fandom_file() {
            local host="$1"
            local file="$2"
            local output="$3"
            local encoded
            encoded=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$file")
            local api="https://${host}/api.php?action=query&format=json&prop=imageinfo&iiprop=url&titles=File:${encoded}"
            local url
            url=$(curl --fail --location --retry 3 --user-agent "Mozilla/5.0" "$api" | jq -r '.query.pages[]?.imageinfo[0]?.url // empty' | head -n 1)
            test -n "$url"
            fetch "$url" "$output"
          }

          fandom_file "forgottenrealms.fandom.com" "Sardina the Tressym.png" "app/public/assets/rewards/curated/sardina-the-tressym.png"
          fandom_file "forgottenrealms.fandom.com" "Cactus the Hedgehog.png" "app/public/assets/rewards/curated/cactus-the-hedgehog.png"
          fetch "https://static.wikia.nocookie.net/neverwinter_gamepedia/images/7/77/Icons_Inventory_Mount_Cauldron_Mythic.png/revision/latest?cb=20210424062237" "app/public/assets/rewards/curated/hags-hexing-cauldron.png"
          fetch "https://static.wikia.nocookie.net/neverwinter_gamepedia/images/3/31/Icon_Lockbox_Sigil_Metallicdragonborn.png/revision/latest?cb=20150115203247" "app/public/assets/rewards/curated/metallic-ancestry-dragonborn.png"
          fetch "https://static.wikia.nocookie.net/neverwinter_gamepedia/images/5/5c/Icon_Lockbox_Resurgence_Legendarypack.png/revision/latest?cb=20151118143748" "app/public/assets/rewards/curated/glorious-resurgence-legendary-pack.png"

      - name: Commit localized artwork
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/assets/rewards/curated
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Store remaining reward artwork locally"
          git pull --rebase origin agent/nwhub-icons-simple-catalog
          git push origin HEAD:agent/nwhub-icons-simple-catalog
