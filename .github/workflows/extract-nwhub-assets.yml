name: Refresh NW Hub media

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-nwhub-media
  cancel-in-progress: false

jobs:
  extract:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[automation] Refresh NW Hub media'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install project dependencies
        run: npm ci

      - name: Install browser and media tools
        run: |
          npm install --no-save --package-lock=false playwright@1.52.0 sharp@0.34.4
          npx playwright install --with-deps chromium

      - name: Extract NW Hub catalog icons
        run: node scripts/extract_nwhub_catalog.mjs

      - name: Localize missing NW Hub artwork
        run: node scripts/sync_nwhub_missing_media.mjs

      - name: Verify catalog and production build
        run: npm run check

      - name: Publish refreshed media to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nwhub-assets.json data/nwhub-media.js data/local-media.js data/media-sync-report.json public/assets/lockboxes public/assets/rewards
          if git diff --cached --quiet; then
            echo "NW Hub media is already current."
            exit 0
          fi
          git commit -m "Refresh NW Hub media"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Close trigger issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "NW Hub media extraction finished, missing artwork was localized, and the refreshed media map was committed directly to main."
