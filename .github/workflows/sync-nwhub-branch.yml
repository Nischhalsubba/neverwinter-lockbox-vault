name: Sync NW Hub icons

on:
  push:
    branches:
      - agent/nwhub-icons-simple-catalog
    paths-ignore:
      - 'app/data/nwhub-assets.json'
      - 'app/data/nwhub-media.js'
      - 'app/data/local-media.js'
      - 'app/data/media-sync-report.json'
      - 'app/public/assets/lockboxes/**'
      - 'app/public/assets/rewards/**'

concurrency:
  group: nwhub-icons-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Install media tools
        working-directory: app
        run: |
          npm install --no-save --package-lock=false playwright@1.52.0 sharp@0.34.4
          npx playwright install --with-deps chromium

      - name: Extract NW Hub catalog icons
        working-directory: app
        run: node scripts/extract_nwhub_catalog.mjs

      - name: Localize missing NW Hub artwork
        working-directory: app
        run: node scripts/sync_nwhub_missing_media.mjs

      - name: Verify tests and production build
        working-directory: app
        run: npm run check

      - name: Commit NW Hub media
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/nwhub-assets.json app/data/nwhub-media.js app/data/local-media.js app/data/media-sync-report.json app/public/assets/lockboxes app/public/assets/rewards
          if git diff --cached --quiet; then
            echo "NW Hub media is already current"
            exit 0
          fi
          git commit -m "Sync NW Hub icons"
          git push origin HEAD:${{ github.ref_name }}
