name: Sync Neverwinter artwork

on:
  push:
    branches:
      - agent/local-artwork-catalog-redesign
    paths-ignore:
      - 'app/public/assets/lockboxes/**'
      - 'app/public/assets/rewards/**'
      - 'app/data/local-media.js'
      - 'app/data/media-sync-report.json'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Install image processor
        working-directory: app
        run: npm install --no-save --package-lock=false sharp@0.34.4

      - name: Fetch and normalize Neverwinter artwork
        working-directory: app
        run: node scripts/sync_neverwinter_media.mjs

      - name: Verify catalog
        working-directory: app
        run: npm test

      - name: Commit resolved artwork
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/assets/lockboxes app/public/assets/rewards app/data/local-media.js app/data/media-sync-report.json
          if git diff --cached --quiet; then
            echo "No media changes to commit"
            exit 0
          fi
          git commit -m "Sync Neverwinter artwork"
          git push origin HEAD:${{ github.ref_name }}
