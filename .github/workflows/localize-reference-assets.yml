name: Localize reference artwork

on:
  push:
    branches:
      - agent/nwhub-icons-simple-catalog

permissions:
  contents: write

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/nwhub-icons-simple-catalog
          fetch-depth: 0

      - name: Download reference artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/public/assets/packs app/public/assets/rewards/curated

          fetch() {
            local url="$1"
            local output="$2"
            curl --fail --location --retry 3 --retry-delay 2 --user-agent "Mozilla/5.0" "$url" --output "$output"
            test -s "$output"
          }

          fetch "https://nw-hub.com/assets/choice-packs/epic-companion-choice-pack.webp" "app/public/assets/packs/companion-choice.webp"
          fetch "https://nw-hub.com/assets/choice-packs/legendary-companion-choice-pack.webp" "app/public/assets/packs/legendary-companion-choice.webp"
          fetch "https://nw-hub.com/assets/choice-packs/legendary-mount-choice-pack.webp" "app/public/assets/packs/mount-choice.webp"
          fetch "https://nw-hub.com/assets/choice-packs/epic-artifact-choice-pack.webp" "app/public/assets/packs/artifact-choice.webp"

          fetch "https://forgottenrealms.fandom.com/wiki/Special:FilePath/Sardina_the_Tressym.png" "app/public/assets/rewards/curated/sardina-the-tressym.png"
          fetch "https://forgottenrealms.fandom.com/wiki/Special:FilePath/Cactus_the_Hedgehog.png" "app/public/assets/rewards/curated/cactus-the-hedgehog.png"
          fetch "https://static.wikia.nocookie.net/neverwinter_gamepedia/images/7/77/Icons_Inventory_Mount_Cauldron_Mythic.png/revision/latest?cb=20210424062237" "app/public/assets/rewards/curated/hags-hexing-cauldron.png"
          fetch "https://static.wikia.nocookie.net/neverwinter_gamepedia/images/3/31/Icon_Lockbox_Sigil_Metallicdragonborn.png/revision/latest?cb=20150115203247" "app/public/assets/rewards/curated/metallic-ancestry-dragonborn.png"
          fetch "https://static.wikia.nocookie.net/neverwinter_gamepedia/images/5/5c/Icon_Lockbox_Resurgence_Legendarypack.png/revision/latest?cb=20151118143748" "app/public/assets/rewards/curated/glorious-resurgence-legendary-pack.png"

      - name: Commit localized artwork
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/assets/packs app/public/assets/rewards/curated
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Store reference artwork locally"
          git pull --rebase origin agent/nwhub-icons-simple-catalog
          git push origin HEAD:agent/nwhub-icons-simple-catalog
